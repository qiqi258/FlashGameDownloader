name: Build & Release FlashGameDownloader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===== 新增：手动触发时自动生成版本号tag =====
      - name: Generate version tag
        id: genver
        if: github.event_name == 'workflow_dispatch'
        run: |
          $timestamp = Get-Date -Format "yyyyMMddHHmm"
          echo "TAG=v${timestamp}" >> $env:GITHUB_OUTPUT
      - name: Set tag name
        id: setver
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch"){
            echo "VERSION=${{ steps.genver.outputs.TAG }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "VERSION=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 requests pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name FlashGameDownloader --add-data "assets;assets" main.py

      - name: Zip artifact
        run: |
          Compress-Archive -Path dist/FlashGameDownloader.exe -DestinationPath FlashGameDownloader-Win.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.setver.outputs.VERSION }}
          files: FlashGameDownloader-Win.zip
          generate_release_notes: true
          draft: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
